name: Deliver notifications

# Calls the app's delivery endpoint every five minutes. This used to be a Vercel
# Cron in vercel.json, but the Hobby plan rejects any cron that runs more than
# once a day, and it rejects the whole deployment with it. GitHub's schedule is
# best effort (a run can start a few minutes late), which the outbox tolerates:
# messages already wait up to ten minutes to coalesce.
#
# Off until the owner turns it on, by setting in this repository:
#   - secret   CRON_SECRET  the same value as CRON_SECRET in Vercel
#   - variable APP_URL      the production origin, e.g. https://courtsync-theta.vercel.app
# Until both exist, every run exits without calling anything.
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}
  cancel-in-progress: false

permissions: {}

jobs:
  deliver:
    name: deliver due notifications
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - name: Call /api/notifications/deliver
        env:
          CRON_SECRET: ${{ secrets.CRON_SECRET }}
          APP_URL: ${{ vars.APP_URL }}
        run: |
          if [ -z "$CRON_SECRET" ] || [ -z "$APP_URL" ]; then
            echo "CRON_SECRET or APP_URL is not set; delivery is off."
            exit 0
          fi
          curl --fail-with-body --silent --show-error --max-time 60 \
            -H "Authorization: Bearer $CRON_SECRET" \
            "${APP_URL%/}/api/notifications/deliver"
